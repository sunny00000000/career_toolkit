# Example reverse proxy config. Copy to /etc/nginx/sites-available/career-toolkit,
# edit `your-domain.com`, then:
#   sudo ln -s /etc/nginx/sites-available/career-toolkit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d your-domain.com   (see README.md)
#
# This is optional but strongly recommended over hitting the app on a raw
# IP:port -- without it, your login password travels in plain HTTP.

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
